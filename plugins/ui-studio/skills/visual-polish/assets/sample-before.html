<!doctype html>
<html><head><meta charset="utf-8"><title>Ten Fixes — sample (before)</title>
<style>
body { background:#0b1220; color:#c9d1dc; font-family: Arial, sans-serif; display:grid; place-items:center; min-height:100vh; }
.card { width:340px; background:#101a2c; padding:14px 10px 18px 22px; border-radius:10px; }
.city { text-align:center; color:#f2b84b; text-decoration:underline; text-transform:uppercase; letter-spacing:0.2em; font-weight:800; font-size:15px; }
.time { text-align:right; font-style:italic; color:#3b4658; font-size:11px; margin-bottom:7px; }
.temp { text-align:center; color:#ef4b5f; font-size:20px; font-weight:700; margin:5px 0 13px; }
.cond { color:#4aa8e8; font-style:italic; text-transform:uppercase; font-size:13px; margin-left:18px; }
.hl { color:#323c4c; font-size:11px; }
.hours { display:flex; gap:22px; margin:18px 0 10px 6px; font-size:12px; }
.hours span { color:#ef4b5f; } .hours .c { color:#4aa8e8; } .hours .w { color:#f2b84b; }
.day { margin:6px 0 6px 0; font-size:12px; } .day b { color:#fff; text-decoration:underline; margin-right:30px; }
.day i { color:#2c3544; margin-left:40px; }
</style></head>
<body>
<div class="card">
  <div class="city">Lisbon</div><div class="time">Tue · 14:00</div>
  <div class="temp">24°</div>
  <div class="cond">Partly cloudy <span class="hl">· H 27° L 18°</span></div>
  <div class="hours"><div>Now<br>⛅<br><span class="w">24°</span></div><div>15<br>☀️<br><span class="c">25°</span></div><div>16<br>🌞<br><span>26°</span></div><div>17<br>🌤<br><span>25°</span></div><div>18<br>☁️<br><span class="w">23°</span></div><div>19<br>🌧<br><span class="c">21°</span></div></div>
  <div class="day"><b>WED</b>☀️<i>17° – 28°</i></div>
  <div class="day"><b>THU</b>🌥<i>18° – 26°</i></div>
  <div class="day"><b>FRI</b>🌧<i>15° – 21°</i></div>
  <div class="day"><b>SAT</b>⛅<i>16° – 24°</i></div>
</div>
</body></html>
